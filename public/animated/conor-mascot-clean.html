<!doctype html><title>Conor Mascot Clean</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;}
body{
  width:600px; height:600px;
  display:flex; align-items:center; justify-content:center;
}
.mascot-wrap{
  position:relative;
  width:78%;
  aspect-ratio:1/1;
  animation: float 3.2s ease-in-out infinite;
  transform-origin: 50% 100%;
}
svg{ display:block; width:100%; height:100%; overflow:visible; }

.eye{ transform-box: fill-box; transform-origin: center; animation: blink 4.6s ease-in-out infinite; }
.eye.eye-b{ animation-delay: 0.03s; }
.wave{ transform-box: fill-box; transform-origin: 90% 90%; animation: wave 3.2s ease-in-out infinite; }
.sparkle{ transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
.bar{ transform-box: fill-box; transform-origin: 50% 100%; animation: bar-bounce 1.6s ease-in-out infinite; }
.bar-1{ animation-duration: 1.5s; animation-delay: 0.3s; }
.bar-2{ animation-duration: 1.7s; animation-delay: 0s; }
.bar-3{ animation-duration: 1.35s; animation-delay: 0.15s; }

@keyframes float{
  0%, 100% { transform: translateY(0) scale(1,1); }
  45% { transform: translateY(-14px) scale(1.01,0.99); }
  55% { transform: translateY(-14px) scale(1.01,0.99); }
}
@keyframes blink{
  0%, 88%, 100% { transform: scaleY(1); }
  92% { transform: scaleY(0.12); }
  96% { transform: scaleY(1); }
}
@keyframes wave{
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-6deg); }
  50% { transform: rotate(4deg); }
  75% { transform: rotate(-3deg); }
}
@keyframes twinkle{
  0%, 100% { transform: scale(0.65) rotate(0deg); opacity:0.35; }
  50% { transform: scale(1.15) rotate(12deg); opacity:1; }
}
@keyframes bar-bounce{
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(0.8); }
}
</style>
